name: surf
on:
  schedule:
    # каждый час круглосуточно (чтобы прогноз на завтра и дальше был свежим)
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 surf/fetch.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add surf/data.json
          git diff --cached --quiet || (git commit -m "Update surf data" && git push)
