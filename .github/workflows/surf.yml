name: surf
on:
  schedule:
    # 06:17-16:17 Вьетнам (UTC+7) = 23:17-09:17 UTC, каждый час
    - cron: '17 23,0-9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 surf/fetch.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add surf/data.json
          git diff --cached --quiet || (git commit -m "Update surf data" && git push)
